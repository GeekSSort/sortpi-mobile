# Checks only, no build. Runs on every pull request and on every push to dev and staging.
# Flow: feature branch -> pull request into dev -> pull request into staging (builds, see staging.yml) -> main (Play Store).
name: checks

on:
  pull_request:
  push:
    branches: [dev, staging]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # expo-env.d.ts is generated by the Expo CLI and not in git; it declares the css imports tsc would otherwise reject.
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npx tsc --noEmit
      - run: npm test
      # ponytail: lint does not block yet, the app still has a few old React Compiler errors (add-product, session-provider).
      # Make it blocking by deleting continue-on-error once they are fixed.
      - run: npx expo lint
        continue-on-error: true
