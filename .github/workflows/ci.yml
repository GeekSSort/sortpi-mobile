# Checks only, no build. Runs on every pull request and on every push to dev and staging.
# Flow: feature branch -> pull request into dev -> pull request into staging (builds, see staging.yml) -> main (Play Store).
name: checks

on:
  pull_request:
  push:
    branches: [dev, staging]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # These checks do not build the native app.
          RNLLAMA_SKIP_POSTINSTALL: "1"
      # expo-env.d.ts is generated by the Expo CLI and not in git; it declares the css imports tsc would otherwise reject.
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npx tsc --noEmit
      - run: npm test
      # Lint errors (the React Compiler rules included) now stop a pull request. Warnings do not.
      - run: npx expo lint
