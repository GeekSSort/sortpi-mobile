# The only workflow that builds. A push to staging builds the release APK and sends it to the Firebase "team" group.
# Needs these repository secrets: FIREBASE_SERVICE_ACCOUNT_JSON (the whole key file), FIREBASE_APP_ID.
name: staging build

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      # expo-env.d.ts is generated by the Expo CLI and not in git; it declares the css imports tsc would otherwise reject.
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npx tsc --noEmit
      - run: npm test

      # Every upload must have a higher versionCode than the last one, so it comes from the run number.
      - name: Set the version code
        run: |
          node -e "const f='app.json';const j=JSON.parse(require('fs').readFileSync(f));j.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER);require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          grep versionCode app.json

      # The Firebase client config is not in git; it is kept as a base64 secret (GOOGLE_SERVICES_JSON).
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json

      # android/ is generated from app.json and is not in git.
      - run: npx expo prebuild --platform android --no-install
      # services.gradle.org is sometimes slow or answers 504; the wrapper's default 10 s read limit then fails the whole release.
      # Give the download two minutes, and try the build up to three times (only a failed download is retried in practice).
      - name: Build the release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for attempt in 1 2 3; do
            ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a && exit 0
            echo "Build attempt $attempt failed"
            sleep 20
          done
          exit 1

      # What testers read in Firebase: the features and fixes in this build, not "Merge pull request" lines.
      # Merges are skipped; only feat/fix/perf commits are listed, with the type turned into a word.
      - name: Release notes
        id: notes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # a push covers everything since the previous staging tip; a manual run has no such tip, so take the latest commits
          range="-n 15"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then range="$BEFORE..HEAD"; fi
          list=$(git log $range --no-merges --pretty='%s' \
            | grep -E '^(feat|fix|perf)(\(|:)' \
            | sed -E 's/ \(#[0-9]+\)$//; s/^feat(\([^)]*\))?: /New: /; s/^fix(\([^)]*\))?: /Fixed: /; s/^perf(\([^)]*\))?: /Faster: /' \
            | awk '!seen[$0]++' | head -12 | sed 's/^/- /')
          if [ -z "$list" ]; then list='- Small improvements'; fi
          {
            echo 'text<<EOF'
            # must not start with '-': the action passes the notes on a command line and would read it as an option
            echo 'What is new in this build:'
            echo "$list"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: team
          file: android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: ${{ steps.notes.outputs.text }}

      - uses: actions/upload-artifact@v4
        with:
          name: sortpi-staging-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
