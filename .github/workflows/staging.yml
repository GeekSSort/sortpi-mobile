# The only workflow that builds. A push to staging builds the release APK and sends it to the Firebase "team" group.
# Needs these repository secrets: FIREBASE_SERVICE_ACCOUNT_JSON (the whole key file), FIREBASE_APP_ID.
name: staging build

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      # expo-env.d.ts is generated by the Expo CLI and not in git; it declares the css imports tsc would otherwise reject.
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npx tsc --noEmit
      - run: npm test

      # Every upload must have a higher versionCode than the last one, so it comes from the run number.
      - name: Set the version code
        run: |
          node -e "const f='app.json';const j=JSON.parse(require('fs').readFileSync(f));j.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER);require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          grep versionCode app.json

      # android/ is generated from app.json and is not in git.
      - run: npx expo prebuild --platform android --no-install
      - name: Build the release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Release notes
        id: notes
        run: |
          {
            echo 'text<<EOF'
            git log -n 8 --pretty='- %s'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: team
          file: android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: ${{ steps.notes.outputs.text }}

      - uses: actions/upload-artifact@v4
        with:
          name: sortpi-staging-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
